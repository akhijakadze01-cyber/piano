<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>სოლფეჯიო • ტრენაჟორი & თეორია</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    body {
      margin: 0;
      padding: 10px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .header {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .title {
      font-size: 1.05rem;
      font-weight: 800;
      color: #1e3a8a;
    }
    .stats-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .theory-btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 16px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .streak-badge {
      background: #fff7ed;
      color: #ea580c;
      border: 1.5px solid #fdba74;
      padding: 4px 8px;
      border-radius: 16px;
      font-size: 0.82rem;
      font-weight: 800;
    }
    .score-badge {
      background: #1e3a8a;
      color: white;
      padding: 5px 10px;
      border-radius: 16px;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .level-container {
      width: 100%;
      max-width: 500px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      background: #ffffff;
      padding: 6px 10px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
    }
    .level-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: #64748b;
      white-space: nowrap;
    }
    .level-select {
      flex: 1;
      padding: 6px 8px;
      font-size: 0.88rem;
      font-weight: bold;
      color: #1e3a8a;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
    }

    .clef-selector {
      width: 100%;
      max-width: 500px;
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .clef-btn {
      flex: 1;
      padding: 7px 2px;
      font-size: 0.85rem;
      font-weight: bold;
      border: 1.5px solid #cbd5e1;
      background: white;
      color: #334155;
      border-radius: 8px;
      cursor: pointer;
    }
    .clef-btn.active {
      background: #1e3a8a;
      color: white;
      border-color: #1e3a8a;
    }

    .staff-container {
      width: 100%;
      max-width: 500px;
      background: #fffefb;
      border: 1.5px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 4px;
      position: relative;
    }
    canvas#staff {
      width: 100%;
      max-width: 480px;
      height: 220px;
    }
    canvas#confetti {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      border-radius: 16px;
    }

    #explanation-box {
      width: 100%;
      max-width: 500px;
      min-height: 48px;
      margin: 6px 0;
      padding: 6px 12px;
      border-radius: 10px;
      background: #e2e8f0;
      font-size: 0.88rem;
      line-height: 1.35;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border: 1px solid transparent;
    }
    .status-line {
      font-weight: 800;
      font-size: 0.98rem;
      margin-bottom: 2px;
    }

    .controls {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .accidental-bar {
      display: flex;
      gap: 6px;
      background: #e2e8f0;
      padding: 5px;
      border-radius: 10px;
    }
    .acc-btn {
      flex: 1;
      background: white;
      color: #334155;
      border: 1.5px solid transparent;
      padding: 7px 0;
      font-size: 1.05rem;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
    }
    .acc-btn.selected {
      background: #ea580c;
      color: white;
    }

    .notes-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .note-btn {
      background: #1e3a8a;
      color: white;
      border: none;
      padding: 13px 0;
      font-size: 1.15rem;
      font-weight: 800;
      border-radius: 10px;
      cursor: pointer;
    }
    .note-btn:active {
      transform: scale(0.96);
      background-color: #172554;
    }
    .sound-btn {
      background: #0284c7;
    }

    /* მოდალური ფანჯარა თეორიისთვის */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(3px);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 14px;

    .modal-content {
      background: white;
      width: 100%;

      max-height: 85vh;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);

    .modal-header {
      padding: 14px 16px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: #1e3a8a;
    }
    .close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      color: #64748b;
      cursor: pointer;
      line-height: 1;
    }
    .modal-body {
      padding: 16px;
      overflow-y: auto;
      font-size: 0.92rem;
      line-height: 1.5;
      color: #334155;
      user-select: text;
    }
    .theory-section {
      margin-bottom: 16px;
    }
    .theory-section h4 {
      margin: 0 0 6px 0;
      color: #0f172a;
      font-size: 1rem;
    }
    .theory-box {
      background: #f8fafc;
      border-left: 3px solid #1e3a8a;
      padding: 8px 12px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 8px;
    }

</head>
<body>

    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playSynthTone(freq) {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.35, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.2);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 1.2);
      } catch (e) {}
    }

    function playSuccessChime() {
      try {
        const ctx = getAudioContext();
        [523.25, 659.25, 783.99].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.05);
          gain.gain.setValueAtTime(0.12, ctx.currentTime + idx * 0.05);
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.6);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.05);
          osc.stop(ctx.currentTime + 0.6);
        });
      } catch (e) {}
    }

    // თეორიული მონაცემთა ბაზა კლასების მიხედვით
    const theoryData = {

    function openTheoryModal() {
      const data = theoryData[currentLevel] || theoryData[4];
      document.getElementById('theory-title').textContent = data.title;
      document.getElementById('theory-body').innerHTML = data.html;
      document.getElementById('theory-modal').style.display = 'flex';
    }

    function closeTheoryModal(e) {
      document.getElementById('theory-modal').style.display = 'none';
    }

    let particles = [];
    function launchSparks() {
      particles = [];
      const colors = ['#f59e0b', '#fbbf24', '#d97706', '#1e3a8a'];
      for (let i = 0; i < 35; i++) {
        particles.push({
          x: confettiCanvas.width / 2,
          y: confettiCanvas.height / 2,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8 - 2,
          size: Math.random() * 4 + 2,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1
        });
      }
      renderConfetti();
    }

    function renderConfetti() {
      confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      let active = false;
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15;
        p.alpha -= 0.025;
        if (p.alpha > 0) {
          active = true;
          confettiCtx.save();
          confettiCtx.globalAlpha = p.alpha;
          confettiCtx.fillStyle = p.color;
          confettiCtx.beginPath();
          confettiCtx.arc(p.x, p.y, p.size, 0, 2 * Math.PI);
          confettiCtx.fill();
          confettiCtx.restore();
        }
      });
      if (active) requestAnimationFrame(renderConfetti);
      else confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    }

    function onLevelChange(levelStr) {
      currentLevel = parseInt(levelStr);
      score = 0;
      attempts = 0;
      streak = 0;
      updateUI();

      if (currentLevel === 1) {
        accidentalBar.style.display = 'none';
        setClefMode('treble');
        document.getElementById('clef-selector-box').style.display = 'none';
      } else {
        accidentalBar.style.display = 'flex';
        document.getElementById('clef-selector-box').style.display = 'flex';
        document.getElementById('acc-doublesharp').style.display = (currentLevel === 4) ? 'block' : 'none';
        document.getElementById('acc-doubleflat').style.display = (currentLevel === 4) ? 'block' : 'none';
      }
      nextQuestion();
    }

    function selectAccidental(acc) {
      selectedAccidental = acc;
      ['natural', 'sharp', 'flat', 'doublesharp', 'doubleflat'].forEach(id => {
        const el = document.getElementById(`acc-${id}`);
        if (el) el.classList.remove('selected');
      });
      if (acc === '' && document.getElementById('acc-natural')) document.getElementById('acc-natural').classList.add('selected');
      if (acc === '♯') document.getElementById('acc-sharp').classList.add('selected');
      if (acc === '♭') document.getElementById('acc-flat').classList.add('selected');
      if (acc === '𝄪' && document.getElementById('acc-doublesharp')) document.getElementById('acc-doublesharp').classList.add('selected');
      if (acc === '𝄫' && document.getElementById('acc-doubleflat')) document.getElementById('acc-doubleflat').classList.add('selected');
    }

    function setClefMode(mode) {
      currentClefMode = mode;
      document.getElementById('btn-treble').classList.toggle('active', mode === 'treble');
      document.getElementById('btn-bass').classList.toggle('active', mode === 'bass');
      document.getElementById('btn-mixed').classList.toggle('active', mode === 'mixed');
      nextQuestion();
    }

    function playCurrentTone() {
      if (!currentQuestion) return;
      const semitoneShift = accidentalSemitones[currentQuestion.accidental] || 0;
      const adjustedFreq = currentQuestion.baseFreq * Math.pow(2, semitoneShift / 12);
      playSynthTone(adjustedFreq);
    }

    function renderStaff() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const centerY = canvas.height / 2;
      const spacing = 34;

      ctx.lineWidth = 3;
      ctx.strokeStyle = '#334155';
      for (let i = -2; i <= 2; i++) {
        let y = centerY - (i * spacing);
        ctx.beginPath();
        ctx.moveTo(30, y);
        ctx.lineTo(canvas.width - 30, y);
        ctx.stroke();
      }

      ctx.save();
      ctx.fillStyle = '#0f172a';
      if (activeClef === 'treble') {
        ctx.font = '145px serif';
        ctx.fillText('𝄞', 45, centerY + 54);
      } else {
        ctx.font = '120px serif';
        ctx.fillText('𝄢', 45, centerY + 24);
      }
      ctx.restore();

      if (!currentQuestion) return;

      const noteX = canvas.width / 2 + 70;
      const baseLine1Y = centerY + (2 * spacing);
      const noteY = baseLine1Y - (currentQuestion.offset * (spacing / 2));

      if (currentQuestion.ledgers && currentQuestion.ledgers.length > 0) {
        ctx.lineWidth = 3.5;
        ctx.strokeStyle = '#334155';
        currentQuestion.ledgers.forEach(lOffset => {
          let ly = baseLine1Y - (lOffset * (spacing / 2));
          ctx.beginPath();
          ctx.moveTo(noteX - 45, ly);
          ctx.lineTo(noteX + 45, ly);
          ctx.stroke();
        });
      }

      if (currentQuestion.accidental !== '') {
        ctx.save();
        ctx.fillStyle = '#b91c1c';
        ctx.font = 'bold 56px serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(currentQuestion.accidental, noteX - 52, noteY - 3);
        ctx.restore();
      }

      ctx.save();
      ctx.translate(noteX, noteY);
      ctx.rotate(-0.35);
      ctx.fillStyle = '#1e3a8a';
      ctx.beginPath();
      ctx.ellipse(0, 0, 26, 19, 0, 0, 2 * Math.PI);
      ctx.fill();
      ctx.restore();

      ctx.lineWidth = 3.5;
      ctx.strokeStyle = '#1e3a8a';
      ctx.beginPath();
      if (currentQuestion.offset < 4) {
        ctx.moveTo(noteX + 22, noteY);
        ctx.lineTo(noteX + 22, noteY - 105);
      } else {
        ctx.moveTo(noteX - 22, noteY);
        ctx.lineTo(noteX - 22, noteY + 105);
      }
      ctx.stroke();
    }

    function nextQuestion() {
      if (currentLevel === 1) {
        activeClef = 'treble';
      } else if (currentClefMode === 'mixed') {
        activeClef = Math.random() > 0.5 ? 'treble' : 'bass';
      } else {
        activeClef = currentClefMode;
      }

      const poolRaw = activeClef === 'treble' ? trebleAll : bassAll;
      const pool = poolRaw.filter(n => n.minLevel <= currentLevel);
      const noteBase = pool[Math.floor(Math.random() * pool.length)];

      let acc = '';
      if (currentLevel === 1) {
        acc = '';
      } else if (currentLevel === 2) {
        acc = Math.random() > 0.6 ? (Math.random() > 0.5 ? '♯' : '♭') : '';
      } else if (currentLevel === 3) {
        acc = Math.random() > 0.5 ? ['♯', '♭'][Math.floor(Math.random() * 2)] : '';
      } else {
        acc = Math.random() > 0.45 ? ['♯', '♭', '𝄪', '𝄫'][Math.floor(Math.random() * 4)] : '';
      }

      currentQuestion = {
        ...noteBase,
        accidental: acc,
        clef: activeClef
      };

      selectAccidental('');
      renderStaff();
    }

    function getAccidentalName(acc) {
      if (acc === '♯') return 'დიეზი';
      if (acc === '♭') return 'ბემოლი';
      if (acc === '𝄪') return 'დუბლ-დიეზი';
      if (acc === '𝄫') return 'დუბლ-ბემოლი';
      return '';
    }

    function updateUI() {
      scoreText.textContent = `${score} / ${attempts}`;
      streakNum.textContent = streak;
    }

    function submitAnswer(noteName) {
      if (!currentQuestion) return;
      attempts++;
      playCurrentTone();

      const userNote = noteName;
      const userAcc = (currentLevel === 1) ? '' : selectedAccidental;
      const isCorrect = (userNote === currentQuestion.name) && (userAcc === currentQuestion.accidental);

      const clefTitle = currentQuestion.clef === 'treble' ? 'ვიოლინოს გასაღები (𝄞)' : 'ბანის გასაღები (𝄢)';
      const fullCorrectName = `${currentQuestion.name} ${getAccidentalName(currentQuestion.accidental)}`.trim();

      if (isCorrect) {
        score++;
        streak++;
        updateUI();

        if (streak % 10 === 0) {
          playSuccessChime();
          launchSparks();
        }

        explanationBox.style.background = '#f0fdf4';
        explanationBox.style.borderColor = '#86efac';
        explanationBox.innerHTML = `
          <div class="status-line" style="color: #166534;">✓ სწორია! — ${fullCorrectName}</div>
          <div style="color: #15803d; font-size: 0.85rem;">${clefTitle}: ${currentQuestion.lineDesc} (${currentQuestion.octave} ოქტავა).</div>
        `;
        setTimeout(nextQuestion, 650);
      } else {
        streak = 0;
        updateUI();

        explanationBox.style.background = '#fef2f2';
        explanationBox.style.borderColor = '#fca5a5';
        
        let hintDetail = '';
        if (userNote !== currentQuestion.name) {
          hintDetail += `ნოტა შეგეშალათ (აირჩიეთ: ${userNote}). `;
        }
        if (currentLevel > 1 && userAcc !== currentQuestion.accidental) {
          const userAccName = getAccidentalName(userAcc) || 'სუფთა (♮)';
          const trueAccName = getAccidentalName(currentQuestion.accidental) || 'სუფთა (♮)';
          hintDetail += `ნიშანი შეგეშალათ (მონიშნული იყო: ${userAccName}, უნდა ყოფილიყო: ${trueAccName}).`;
        }

        explanationBox.innerHTML = `
          <div class="status-line" style="color: #991b1b;">✗ შეცდომაა! სწორია: ${fullCorrectName}</div>
          <div style="color: #b91c1c; font-size: 0.85rem;">
            <b>აკადემიური წესი:</b> ${clefTitle}-ში ${currentQuestion.lineDesc} მდებარეობს <b>${currentQuestion.name}</b> (${currentQuestion.octave} ოქტავა). ${hintDetail}
          </div>
        `;
      }
    }

    onLevelChange(document.getElementById('level-select').value);
  </script>
